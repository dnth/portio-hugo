<!-- Chat LLM Component -->
<div id="chat-llm-container" class="chat-llm-container">
  <div id="chat-llm-toggle" class="chat-llm-toggle">
    <i class="fa fa-comments"></i>
  </div>
  <div id="chat-llm-box" class="chat-llm-box">
    <div class="chat-llm-header">
      <h5>Ask about this article</h5>
      <button id="chat-llm-close" class="chat-llm-close">
        <i class="fa fa-times"></i>
      </button>
    </div>
    <!-- Social Chat Buttons -->
    <div class="chat-llm-social-buttons">
      <a href="https://api.whatsapp.com/send?phone=60133250827" rel="noopener" target="_blank" class="btn btn-sm btn-primary mr-2">
        <i class="fa fa-whatsapp"></i>&nbsp;WhatsApp
      </a>
      <a href="https://t.me/dicksonneoh" rel="noopener" target="_blank" class="btn btn-sm btn-primary">
        <i class="fa fa-telegram"></i>&nbsp;Telegram
      </a>
    </div>
    <div id="chat-llm-messages" class="chat-llm-messages">
      <div class="chat-llm-message chat-llm-message-assistant">
        <div class="chat-llm-message-content">
          Hi! I'm an LLM assistant. I can answer questions about this article. What would you like to know? 
          <br>
          <br>
          If you do not find the information you need, contact the author directly via WhatsApp or Telegram.
        </div>
      </div>
    </div>
    <div class="chat-llm-input-container">
      <textarea id="chat-llm-input" class="chat-llm-input" placeholder="Type your question here..." rows="1"></textarea>
      <button id="chat-llm-send" class="chat-llm-send">
        <i class="fa fa-paper-plane"></i>
      </button>
    </div>
  </div>
</div>
